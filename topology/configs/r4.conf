frr version 10.5.1
frr defaults traditional
hostname r4
no ipv6 forwarding
!
route-map PERMIT-ALL permit 10
!
interface eth1
 ip address 10.0.24.2/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.34.2/30
 ip ospf network point-to-point
!
interface eth3
 ip address 10.0.46.1/30
!
interface lo
 ip address 4.4.4.4/32
!
router ospf
 ospf router-id 4.4.4.4
 network 4.4.4.4/32 area 0
 network 10.0.24.0/30 area 0
 network 10.0.34.0/30 area 0
!
router bgp 65000
 bgp router-id 4.4.4.4
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source lo
 neighbor 10.0.46.2 remote-as 65200
 !
 address-family ipv4 unicast
  network 4.4.4.4/32
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 next-hop-self
  neighbor 10.0.46.2 activate
  neighbor 10.0.46.2 route-map PERMIT-ALL in
  neighbor 10.0.46.2 route-map PERMIT-ALL out
 exit-address-family
!
mpls ldp
 router-id 4.4.4.4
 !
 address-family ipv4
  discovery transport-address 4.4.4.4
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
