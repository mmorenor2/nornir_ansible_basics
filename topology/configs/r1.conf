frr version 10.5.1_git
frr defaults traditional
hostname r1
no ipv6 forwarding
!
route-map PERMIT-ALL permit 10
exit
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 10.0.13.1/30
 ip ospf network point-to-point
exit
!
interface eth3
 ip address 10.0.15.1/30
exit
!
interface lo
 ip address 1.1.1.1/32
exit
!
router bgp 65000
 bgp router-id 1.1.1.1
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source lo
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 update-source lo
 neighbor 4.4.4.4 remote-as 65000
 neighbor 4.4.4.4 update-source lo
 neighbor 10.0.15.2 remote-as 65100
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
  neighbor 2.2.2.2 route-reflector-client
  neighbor 2.2.2.2 next-hop-self
  neighbor 3.3.3.3 route-reflector-client
  neighbor 3.3.3.3 next-hop-self
  neighbor 4.4.4.4 route-reflector-client
  neighbor 4.4.4.4 next-hop-self
  neighbor 10.0.15.2 activate 
  neighbor 10.0.15.2 route-map PERMIT-ALL in
  neighbor 10.0.15.2 route-map PERMIT-ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 1.1.1.1
 network 1.1.1.1/32 area 0
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
 mpls ldp-sync
exit
!
mpls ldp
 router-id 1.1.1.1
 !
 address-family ipv4
  discovery transport-address 1.1.1.1
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
