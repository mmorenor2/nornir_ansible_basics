set / system name host-name r6
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 6.6.6.6/32
set / network-instance default interface system0.0
set / interface lo1 admin-state enable
set / interface lo1 subinterface 0 admin-state enable
set / interface lo1 subinterface 0 ipv4 admin-state enable
set / interface lo1 subinterface 0 ipv4 address 172.16.6.1/24
set / network-instance default interface lo1.0
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.46.2/30
set / network-instance default interface ethernet-1/1.0
set / routing-policy prefix-set r6-routes prefix 6.6.6.6/32 mask-length-range 32..32
set / routing-policy prefix-set r6-routes prefix 172.16.6.0/24 mask-length-range 24..24
set / routing-policy policy export-r6 statement 1 match prefix prefix-set r6-routes
set / routing-policy policy export-r6 statement 1 action policy-result accept
set / routing-policy policy import-r6 statement 1 action policy-result accept
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65200
set / network-instance default protocols bgp router-id 6.6.6.6
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ebgp admin-state enable
set / network-instance default protocols bgp group ebgp export-policy [ export-r6 ]
set / network-instance default protocols bgp group ebgp import-policy [ import-r6 ]
set / network-instance default protocols bgp neighbor 10.0.46.1 admin-state enable
set / network-instance default protocols bgp neighbor 10.0.46.1 peer-as 65000
set / network-instance default protocols bgp neighbor 10.0.46.1 peer-group ebgp