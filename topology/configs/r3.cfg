! Arista EOS startup-config. Loaded by containerlab at boot, same
! mechanism as the FRR/SR Linux nodes' startup-config.
! MPLS/LDP syntax confirmed against Arista's own docs/lab guides:
! https://labguides.testdrive.arista.com/2025.1/advanced_routing/ring/ldp_ip_vpn/lg_ring_ldp_establish/
!
hostname r3
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   mtu 9200
   no switchport
   ip address 10.0.13.2/30
   mpls ldp interface
   ip ospf network point-to-point
   ip ospf mtu-ignore
!
interface Ethernet2
   mtu 9200
   no switchport
   ip address 10.0.34.1/30
   mpls ldp interface
   ip ospf network point-to-point
   ip ospf mtu-ignore
!
interface Loopback0
   ip address 3.3.3.3/32
   mpls ldp interface
!
ip routing
!
router ospf 1
   router-id 3.3.3.3
   network 3.3.3.3/32 area 0.0.0.0
   network 10.0.13.0/30 area 0.0.0.0
   network 10.0.34.0/30 area 0.0.0.0
!
mpls ip
!
mpls ldp
   router-id interface Loopback0
   transport-address interface Loopback0
   interface disabled default
   no shutdown
!
interface Ethernet1
   mpls ldp interface
!
interface Ethernet2
   mpls ldp interface
!
router bgp 65000
   router-id 3.3.3.3
   neighbor 1.1.1.1 remote-as 65000
   neighbor 1.1.1.1 update-source Loopback0
   address-family ipv4
      neighbor 1.1.1.1 activate
      network 3.3.3.3/32
!
end
