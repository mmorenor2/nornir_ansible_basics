frr version 10.5.1
frr defaults traditional
hostname r5
no ipv6 forwarding
!
route-map PERMIT-ALL permit 10 
exit
!
interface eth1
 ip address 10.0.15.2/30
!
interface lo
 ip address 5.5.5.5/32
 ip address 172.16.5.1/32
!
! Blackhole route so 172.16.5.0/24 exists in the RIB to originate into
! BGP - stands in for "a real downstream customer LAN".
ip route 172.16.5.0/24 Null0
!
router bgp 65100
 bgp router-id 5.5.5.5
 neighbor 10.0.15.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 172.16.5.0/24
  network 10.0.15.0/30
  neighbor 10.0.15.1 activate
  neighbor 10.0.15.1 route-map PERMIT-ALL in
  neighbor 10.0.15.1 route-map PERMIT-ALL out
 exit-address-family
!
line vty
!
