---
all:
  children:
    frr:
      # ansible_host here is the container NAME, not an IP - the
      # community.docker.docker connection plugin execs into it directly
      # (`docker exec <name> ...`), since these containers have no SSH
      # server. Only works when Ansible runs on the same host as
      # containerlab (it does, per the workflow below).
      hosts:
        r1:
          ansible_host: clab-netauto-lab-r1
        r2:
          ansible_host: clab-netauto-lab-r2
        r4:
          ansible_host: clab-netauto-lab-r4
        r5:
          ansible_host: clab-netauto-lab-r5
    eos:
      hosts:
        r3:
          ansible_host: 172.100.100.13
    srlinux:
      hosts:
        r6:
          ansible_host: 172.100.100.16
          as_number: 65200
